# Perfil PRODUCCION (version entregada a la empresa).
# Se activa con:  SPRING_PROFILES_ACTIVE=prod   (o --spring.profiles.active=prod)

# Toda cuenta nueva es Usuario Final; el Gestor asigna los demas roles.
hardtrack.demo.seleccion-rol=false

# Cookie de sesion: solo por HTTPS y no accesible desde JavaScript.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# No mostrar las consultas SQL en los registros.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
