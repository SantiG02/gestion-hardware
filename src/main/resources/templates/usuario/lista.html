<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragmentos/layout :: cabecera}"></head>
<body>

<div class="disposicion">

    <div th:replace="~{fragmentos/layout :: sidebar}"></div>

    <div class="contenido">

        <div th:replace="~{fragmentos/layout :: barrasuperior('Usuarios')}"></div>

        <main class="contenido__cuerpo">

            <div class="encabezado">
                <div>
                    <h1 class="encabezado__titulo">Gestión de usuarios</h1>
                    <p class="encabezado__intro">Administra los accesos al sistema</p>
                </div>
                <a th:href="@{/usuarios/nuevo}" class="boton">Nuevo usuario</a>
            </div>

            <div th:if="${exito}" class="aviso aviso--exito" th:text="${exito}"></div>
            <div th:if="${aviso}" class="aviso aviso--info" th:text="${aviso}"></div>
            <div th:if="${error}" class="aviso aviso--error" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(usuarios)}" class="aviso aviso--info">
                No hay usuarios registrados todavía.
            </div>

            <div th:unless="${#lists.isEmpty(usuarios)}" class="panel panel--tabla">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Área</th>
                        <th>Estado</th>
                        <th class="tabla__acciones">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.nombreCompleto}">-</td>

                        <td th:text="${usuario.documento} ?: '—'">-</td>

                        <td th:text="${usuario.email}">-</td>

                        <td>
                            <span class="insignia insignia--rol"
                                  th:text="${usuario.rol.nombre}">-</span>
                        </td>

                        <td th:text="${usuario.area?.nombre} ?: 'Sin asignar'">-</td>

                        <td>
                            <span class="insignia"
                                  th:classappend="${usuario.activo} ? 'insignia--estable' : 'insignia--neutra'"
                                  th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">-</span>
                        </td>

                        <td class="tabla__acciones">
                            <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"
                               class="boton boton--secundario boton--pequeno">Editar</a>

                            <form th:if="${usuario.activo}"
                                  th:action="@{/usuarios/{id}/desactivar(id=${usuario.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('¿Inactivar este usuario? No podrá volver a ingresar al sistema.');">
                                <button type="submit"
                                        class="boton boton--peligro boton--pequeno">Inactivar</button>
                            </form>

                            <form th:unless="${usuario.activo}"
                                  th:action="@{/usuarios/{id}/activar(id=${usuario.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('¿Activar este usuario? Podrá volver a ingresar al sistema.');">
                                <button type="submit"
                                        class="boton boton--exito boton--pequeno">Activar</button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

</div>

</body>
</html>
