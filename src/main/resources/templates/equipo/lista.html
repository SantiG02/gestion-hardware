<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Inventario de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Inventario de equipos</h1>
        <a th:href="@{/equipos/nuevo}" class="btn btn-dark">Registrar equipo</a>
    </div>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(equipos)}" class="alert alert-info">
        No hay equipos registrados todavia.
    </div>

    <table th:unless="${#lists.isEmpty(equipos)}" class="table table-striped bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>Codigo</th>
            <th>Serial</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Area</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.codigoInterno}">-</td>
            <td th:text="${equipo.serial}">-</td>
            <td th:text="${equipo.marca}">-</td>
            <td th:text="${equipo.modelo}">-</td>
            <td th:text="${equipo.area.nombre}">-</td>
            <td th:text="${equipo.estadoEquipo.nombre}">-</td>
            <td class="text-end">
                <a th:href="@{/equipos/{id}/editar(id=${equipo.id})}"
                   class="btn btn-sm btn-outline-dark">Editar</a>

                <form th:action="@{/equipos/{id}/desactivar(id=${equipo.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Dar de baja este equipo del inventario?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Dar de baja</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
