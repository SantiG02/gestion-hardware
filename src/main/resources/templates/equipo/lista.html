<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <h1 class="h3 mb-4">Inventario de equipos</h1>

    <div th:if="${#lists.isEmpty(equipos)}" class="alert alert-info">
        No hay equipos registrados todavia.
    </div>

    <table th:unless="${#lists.isEmpty(equipos)}" class="table table-striped bg-white">
        <thead class="table-dark">
        <tr>
            <th>Codigo</th>
            <th>Serial</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Area</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.codigoInterno}">-</td>
            <td th:text="${equipo.serial}">-</td>
            <td th:text="${equipo.marca}">-</td>
            <td th:text="${equipo.modelo}">-</td>
            <td th:text="${equipo.area.nombre}">-</td>
            <td th:text="${equipo.estadoEquipo.nombre}">-</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
