<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragmentos/layout :: cabecera}"></head>
<body>

<div class="disposicion">

    <div th:replace="~{fragmentos/layout :: sidebar}"></div>

    <div class="contenido">

        <div th:replace="~{fragmentos/layout :: barrasuperior('Equipos')}"></div>

        <main class="contenido__cuerpo">

            <div class="encabezado">
                <div>
                    <h1 class="encabezado__titulo">Inventario de equipos</h1>
                    <p class="encabezado__intro">Registro y trazabilidad del parque tecnológico</p>
                </div>
                <a sec:authorize="hasRole('GESTOR')"
                   th:href="@{/equipos/nuevo}" class="boton">Registrar equipo</a>
            </div>

            <div th:if="${exito}" class="aviso aviso--exito" th:text="${exito}"></div>
            <div th:if="${error}" class="aviso aviso--error" th:text="${error}"></div>

            <form method="get" th:action="@{/equipos}" class="panel filtros">

                <div class="campo">
                    <label class="campo__etiqueta">Buscar</label>
                    <input class="campo__entrada" type="text" name="texto"
                           th:value="${param.texto != null ? param.texto[0] : ''}"
                           placeholder="Código, serial, marca, modelo..." />
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Sede</label>
                    <select class="campo__seleccion" name="sedeId">
                        <option value="">Todas</option>
                        <option th:each="s : ${sedes}" th:value="${s.id}"
                                th:selected="${param.sedeId != null and param.sedeId[0] == ''+s.id}"
                                th:text="${s.nombre}">-</option>
                    </select>
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Área</label>
                    <select class="campo__seleccion" name="areaId">
                        <option value="">Todas</option>
                        <option th:each="a : ${areas}" th:value="${a.id}"
                                th:selected="${param.areaId != null and param.areaId[0] == ''+a.id}"
                                th:text="${a.nombre}">-</option>
                    </select>
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Estado</label>
                    <select class="campo__seleccion" name="estadoId">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e.id}"
                                th:selected="${param.estadoId != null and param.estadoId[0] == ''+e.id}"
                                th:text="${e.nombre}">-</option>
                    </select>
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Responsable</label>
                    <select class="campo__seleccion" name="responsableId">
                        <option value="">Todos</option>
                        <option th:each="u : ${usuarios}" th:value="${u.id}"
                                th:selected="${param.responsableId != null and param.responsableId[0] == ''+u.id}"
                                th:text="${u.nombreCompleto}">-</option>
                    </select>
                </div>

                <div class="filtros__acciones">
                    <button type="submit" class="boton boton--secundario">Filtrar</button>
                    <a th:href="@{/equipos}" class="boton boton--secundario">Limpiar</a>
                </div>

            </form>

            <div th:if="${#lists.isEmpty(equipos)}" class="aviso aviso--info">
                No hay equipos que coincidan con el filtro.
            </div>

            <div th:unless="${#lists.isEmpty(equipos)}" class="panel panel--tabla">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Serial</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Área</th>
                        <th>Responsable</th>
                        <th>Estado</th>
                        <th class="tabla__acciones">Consulta</th>
                        <th class="tabla__acciones" sec:authorize="hasRole('GESTOR')">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="equipo : ${equipos}">

                        <td th:text="${equipo.codigoInterno}">-</td>

                        <td th:text="${equipo.serial}">-</td>

                        <td th:text="${equipo.marca}">-</td>

                        <td th:text="${equipo.modelo}">-</td>

                        <td th:text="${equipo.area?.nombre} ?: 'Sin asignar'">-</td>

                        <td th:text="${equipo.usuarioAsignado?.nombreCompleto} ?: 'Sin asignar'"
                            class="texto-suave">-</td>

                        <td>
                            <span class="insignia" th:text="${equipo.estadoEquipo.nombre}">-</span>
                        </td>

                        <td class="tabla__acciones">
                            <a th:href="@{/equipos/{id}/historial(id=${equipo.id})}"
                               class="boton boton--secundario boton--pequeno">Historial</a>
                        </td>

                        <td class="tabla__acciones" sec:authorize="hasRole('GESTOR')">
                            <a th:href="@{/equipos/{id}/editar(id=${equipo.id})}"
                               class="boton boton--secundario boton--pequeno">Editar</a>

                            <form th:action="@{/equipos/{id}/desactivar(id=${equipo.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('¿Dar de baja este equipo del inventario?');">
                                <button type="submit"
                                        class="boton boton--peligro boton--pequeno">Dar de baja</button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

</div>

</body>
</html>
