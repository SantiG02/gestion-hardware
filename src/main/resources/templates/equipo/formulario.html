<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/layout :: cabecera}"></head>
<body>

<div class="disposicion">

    <div th:replace="~{fragmentos/layout :: sidebar}"></div>

    <div class="contenido">

        <div th:replace="~{fragmentos/layout :: barrasuperior('Equipos')}"></div>

        <main class="contenido__cuerpo">

            <p style="margin: 0 0 12px;">
                <a th:href="@{/equipos}" class="texto-suave"
                   style="font-size: 13.5px; text-decoration: none;">← Volver al inventario</a>
            </p>

            <div class="encabezado">
                <div>
                    <h1 class="encabezado__titulo"
                        th:text="${equipo.id == null} ? 'Registrar equipo' : 'Editar equipo'">
                        Registrar equipo
                    </h1>
                    <p class="encabezado__intro">Identificación, especificaciones técnicas y ubicación</p>
                </div>
            </div>

            <div class="panel">

                <form th:action="@{/equipos/guardar}" th:object="${equipo}" method="post">

                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{activo}" />

                    <h2 style="font-size:14px; text-transform:uppercase; letter-spacing:.05em;
                               color:var(--texto-suave); margin-bottom:16px;">Identificación</h2>

                    <div class="rejilla">

                        <div class="campo">
                            <label class="campo__etiqueta">Código interno *</label>
                            <input class="campo__entrada" type="text" th:field="*{codigoInterno}"
                                   th:classappend="${#fields.hasErrors('codigoInterno')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{codigoInterno}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Serial *</label>
                            <input class="campo__entrada" type="text" th:field="*{serial}"
                                   th:classappend="${#fields.hasErrors('serial')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{serial}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Tipo de equipo</label>
                            <select class="campo__seleccion" th:field="*{tipoEquipo}">
                                <option value="">-- Seleccione --</option>
                                <option th:each="t : ${tipos}"
                                        th:value="${t.id}"
                                        th:text="${t.nombre}"></option>
                            </select>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Marca *</label>
                            <input class="campo__entrada" type="text" th:field="*{marca}"
                                   th:classappend="${#fields.hasErrors('marca')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{marca}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Modelo *</label>
                            <input class="campo__entrada" type="text" th:field="*{modelo}"
                                   th:classappend="${#fields.hasErrors('modelo')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{modelo}"></span>
                        </div>

                    </div>

                    <h2 style="font-size:14px; text-transform:uppercase; letter-spacing:.05em;
                               color:var(--texto-suave); margin:28px 0 16px;">Ubicación y estado</h2>

                    <div class="rejilla">

                        <div class="campo">
                            <label class="campo__etiqueta">Área *</label>
                            <select class="campo__seleccion" th:field="*{area}"
                                    th:classappend="${#fields.hasErrors('area')} ? 'campo__seleccion--error'">
                                <option value="">-- Seleccione --</option>
                                <option th:each="a : ${areas}"
                                        th:value="${a.id}"
                                        th:text="${a.nombre}"></option>
                            </select>
                            <span class="campo__error" th:errors="*{area}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Estado *</label>
                            <select class="campo__seleccion" th:field="*{estadoEquipo}"
                                    th:classappend="${#fields.hasErrors('estadoEquipo')} ? 'campo__seleccion--error'">
                                <option value="">-- Seleccione --</option>
                                <option th:each="e : ${estados}"
                                        th:value="${e.id}"
                                        th:text="${e.nombre}"></option>
                            </select>
                            <span class="campo__error" th:errors="*{estadoEquipo}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Usuario responsable</label>
                            <select class="campo__seleccion" th:field="*{usuarioAsignado}">
                                <option value="">-- Sin asignar --</option>
                                <option th:each="u : ${usuarios}"
                                        th:value="${u.id}"
                                        th:text="${u.nombreCompleto}"></option>
                            </select>
                            <span class="campo__ayuda">Persona que tiene el equipo a su cargo.</span>
                        </div>

                    </div>

                    <h2 style="font-size:14px; text-transform:uppercase; letter-spacing:.05em;
                               color:var(--texto-suave); margin:28px 0 16px;">Especificaciones técnicas</h2>

                    <div class="rejilla">

                        <div class="campo">
                            <label class="campo__etiqueta">Procesador</label>
                            <input class="campo__entrada" type="text" th:field="*{procesador}" />
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">RAM (GB)</label>
                            <input class="campo__entrada" type="number" th:field="*{ramGb}"
                                   th:classappend="${#fields.hasErrors('ramGb')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{ramGb}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Tipo de almacenamiento</label>
                            <select class="campo__seleccion" th:field="*{tipoAlmacenamiento}">
                                <option value="">-- Seleccione --</option>
                                <option value="HDD">HDD</option>
                                <option value="SSD">SSD</option>
                                <option value="NVMe">NVMe</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Capacidad (GB)</label>
                            <input class="campo__entrada" type="number" th:field="*{capacidadGb}"
                                   th:classappend="${#fields.hasErrors('capacidadGb')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{capacidadGb}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Sistema operativo</label>
                            <input class="campo__entrada" type="text" th:field="*{sistemaOperativo}" />
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Última actualización del SO</label>
                            <input class="campo__entrada" type="date" th:field="*{fechaUltimaActualizacionSo}"
                                   th:classappend="${#fields.hasErrors('fechaUltimaActualizacionSo')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{fechaUltimaActualizacionSo}"></span>
                        </div>

                    </div>

                    <h2 style="font-size:14px; text-transform:uppercase; letter-spacing:.05em;
                               color:var(--texto-suave); margin:28px 0 16px;">Ciclo de vida</h2>

                    <div class="rejilla">

                        <div class="campo">
                            <label class="campo__etiqueta">Fecha de compra *</label>
                            <input class="campo__entrada" type="date" th:field="*{fechaCompra}"
                                   th:classappend="${#fields.hasErrors('fechaCompra')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{fechaCompra}"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__etiqueta">Fecha de puesta en operación</label>
                            <input class="campo__entrada" type="date" th:field="*{fechaPuestaOperacion}"
                                   th:classappend="${#fields.hasErrors('fechaPuestaOperacion')} ? 'campo__entrada--error'" />
                            <span class="campo__error" th:errors="*{fechaPuestaOperacion}"></span>
                        </div>

                    </div>

                    <div class="campo" style="margin-top:20px;">
                        <label class="campo__etiqueta">Observaciones</label>
                        <textarea class="campo__area" rows="3" th:field="*{observaciones}"></textarea>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 24px;">
                        <button type="submit" class="boton">Guardar</button>
                        <a th:href="@{/equipos}" class="boton boton--secundario">Cancelar</a>
                    </div>

                </form>

            </div>

        </main>

    </div>

</div>

</body>
</html>
