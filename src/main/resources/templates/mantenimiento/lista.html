<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/layout :: cabecera}"></head>
<body>

<div class="disposicion">

    <div th:replace="~{fragmentos/layout :: sidebar}"></div>

    <div class="contenido">

        <div th:replace="~{fragmentos/layout :: barrasuperior('Mantenimientos')}"></div>

        <main class="contenido__cuerpo">

            <div class="encabezado">
                <div>
                    <h1 class="encabezado__titulo">Mantenimientos</h1>
                    <p class="encabezado__intro">Intervenciones preventivas y correctivas sobre los equipos</p>
                </div>
                <a th:href="@{/mantenimientos/nuevo}" class="boton">Registrar mantenimiento</a>
            </div>

            <div th:if="${exito}" class="aviso aviso--exito" th:text="${exito}"></div>
            <div th:if="${error}" class="aviso aviso--error" th:text="${error}"></div>

            <div th:if="${aviso}" class="aviso aviso--info">
                <span th:text="${aviso}"></span>
                <a th:if="${incidenciaPendienteId}"
                   th:href="@{/incidencias/{id}/cerrar(id=${incidenciaPendienteId})}"
                   style="font-weight:600;">Cerrar incidencia ahora</a>
            </div>

            <form method="get" th:action="@{/mantenimientos}" class="panel filtros">

                <div class="campo">
                    <label class="campo__etiqueta">Buscar equipo</label>
                    <input class="campo__entrada" type="text" name="texto"
                           th:value="${param.texto != null ? param.texto[0] : ''}"
                           placeholder="Código, marca, modelo..." />
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Tipo</label>
                    <select class="campo__seleccion" name="tipo">
                        <option value="">Todos</option>
                        <option value="PREVENTIVO" th:selected="${param.tipo != null and param.tipo[0] == 'PREVENTIVO'}">Preventivo</option>
                        <option value="CORRECTIVO" th:selected="${param.tipo != null and param.tipo[0] == 'CORRECTIVO'}">Correctivo</option>
                    </select>
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Estado</label>
                    <select class="campo__seleccion" name="estado">
                        <option value="">Todos</option>
                        <option value="PROGRAMADO" th:selected="${param.estado != null and param.estado[0] == 'PROGRAMADO'}">Programado</option>
                        <option value="FINALIZADO" th:selected="${param.estado != null and param.estado[0] == 'FINALIZADO'}">Finalizado</option>
                    </select>
                </div>

                <div class="campo">
                    <label class="campo__etiqueta">Técnico</label>
                    <select class="campo__seleccion" name="tecnicoId">
                        <option value="">Todos</option>
                        <option th:each="t : ${tecnicos}" th:value="${t.id}"
                                th:selected="${param.tecnicoId != null and param.tecnicoId[0] == ''+t.id}"
                                th:text="${t.nombreCompleto}">-</option>
                    </select>
                </div>

                <div class="filtros__acciones">
                    <button type="submit" class="boton boton--secundario">Filtrar</button>
                    <a th:href="@{/mantenimientos}" class="boton boton--secundario">Limpiar</a>
                </div>

            </form>

            <div th:if="${#lists.isEmpty(mantenimientos)}" class="aviso aviso--info">
                No hay mantenimientos que coincidan con el filtro.
            </div>

            <div th:unless="${#lists.isEmpty(mantenimientos)}" class="panel panel--tabla">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>Tipo</th>
                        <th>Técnico</th>
                        <th>Programado</th>
                        <th>Ejecutado</th>
                        <th>Resultado</th>
                        <th>Estado</th>
                        <th class="tabla__acciones">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="man : ${mantenimientos}">

                        <td>
                            <strong th:text="${man.equipo.codigoInterno}">-</strong><br />
                            <span class="texto-suave" style="font-size:12.5px"
                                  th:text="${man.equipo.area.nombre}">-</span>
                        </td>

                        <td>
                            <span class="insignia"
                                  th:classappend="${man.tipo == 'PREVENTIVO'} ? 'insignia--estable' : 'insignia--seguimiento'"
                                  th:text="${man.tipo}">-</span>
                            <br th:if="${man.incidencia != null}" />
                            <span th:if="${man.incidencia != null}" class="texto-suave"
                                  style="font-size:12px"
                                  th:text="'Incidencia #' + ${man.incidencia.id}">-</span>
                        </td>

                        <td th:text="${man.tecnico.nombreCompleto}">-</td>

                        <td th:text="${man.fechaProgramada != null}
                                     ? ${#temporals.format(man.fechaProgramada, 'dd/MM/yyyy')}
                                     : '—'">-</td>

                        <td th:text="${man.fechaEjecucion != null}
                                     ? ${#temporals.format(man.fechaEjecucion, 'dd/MM/yyyy')}
                                     : '—'">-</td>

                        <td th:text="${man.resultado} ?: '—'">-</td>

                        <td>
                            <span class="insignia"
                                  th:classappend="${man.estado == 'FINALIZADO'} ? 'insignia--estable' : 'insignia--seguimiento'"
                                  th:text="${man.estado}">-</span>
                        </td>

                        <td class="tabla__acciones">
                            <a th:href="@{/mantenimientos/{id}/editar(id=${man.id})}"
                               class="boton boton--secundario boton--pequeno">Editar</a>

                            <a th:unless="${man.estado == 'FINALIZADO'}"
                               th:href="@{/mantenimientos/{id}/finalizar(id=${man.id})}"
                               class="boton boton--exito boton--pequeno">Finalizar</a>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

</div>

</body>
</html>
