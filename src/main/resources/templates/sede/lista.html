<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/layout :: cabecera}"></head>
<body>

<div class="disposicion">

    <div th:replace="~{fragmentos/layout :: sidebar}"></div>

    <div class="contenido">

        <div th:replace="~{fragmentos/layout :: barrasuperior('Sedes y áreas')}"></div>

        <main class="contenido__cuerpo">

            <div class="encabezado">
                <div>
                    <h1 class="encabezado__titulo">Sedes y áreas</h1>
                    <p class="encabezado__intro">Estructura organizacional de la empresa</p>
                </div>
                <a th:href="@{/sedes/nuevo}" class="boton">Nueva sede</a>
            </div>

            <div th:if="${exito}" class="aviso aviso--exito" th:text="${exito}"></div>
            <div th:if="${error}" class="aviso aviso--error" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(sedes)}" class="aviso aviso--info">
                No hay sedes registradas todavía.
            </div>

            <div th:unless="${#lists.isEmpty(sedes)}" class="panel panel--tabla">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Ciudad</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                        <th class="tabla__acciones">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sede : ${sedes}">

                        <td th:text="${sede.nombre}">-</td>

                        <td th:text="${sede.ciudad}">-</td>

                        <td th:text="${sede.direccion} ?: '—'">-</td>

                        <td>
                            <span class="insignia"
                                  th:classappend="${sede.activo} ? 'insignia--estable' : 'insignia--neutra'"
                                  th:text="${sede.activo} ? 'Activa' : 'Inactiva'">-</span>
                        </td>

                        <td class="tabla__acciones">
                            <a th:href="@{/sedes/{id}/areas(id=${sede.id})}"
                               class="boton boton--secundario boton--pequeno">Ver áreas</a>

                            <a th:href="@{/sedes/{id}/editar(id=${sede.id})}"
                               class="boton boton--secundario boton--pequeno">Editar</a>

                            <form th:if="${sede.activo}"
                                  th:action="@{/sedes/{id}/desactivar(id=${sede.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('¿Inactivar esta sede? Sus áreas también quedarán inactivas.');">
                                <button type="submit"
                                        class="boton boton--peligro boton--pequeno">Inactivar</button>
                            </form>

                            <form th:unless="${sede.activo}"
                                  th:action="@{/sedes/{id}/activar(id=${sede.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('¿Activar esta sede?');">
                                <button type="submit"
                                        class="boton boton--exito boton--pequeno">Activar</button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

</div>

</body>
</html>
