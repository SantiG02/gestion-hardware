<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos/layout :: cabecera}"></head>
<body>

<div class="disposicion">

    <div th:replace="~{fragmentos/layout :: sidebar}"></div>

    <div class="contenido">

        <div th:replace="~{fragmentos/layout :: barrasuperior('Tipos de equipo')}"></div>

        <main class="contenido__cuerpo">

            <p style="margin: 0 0 12px;">
                <a th:href="@{/tipos-equipo}" class="texto-suave"
                   style="font-size: 13.5px; text-decoration: none;">← Volver a tipos de equipo</a>
            </p>

            <div class="encabezado">
                <div>
                    <h1 class="encabezado__titulo"
                        th:text="'Campos de ' + ${tipo.nombre}">Campos</h1>
                    <p class="encabezado__intro">Datos propios que se piden al registrar un equipo de este tipo.</p>
                </div>
                <a th:href="@{/tipos-equipo/{id}/campos/nuevo(id=${tipo.id})}" class="boton">Nuevo campo</a>
            </div>

            <div th:if="${exito}" class="aviso aviso--exito" th:text="${exito}"></div>
            <div th:if="${error}" class="aviso aviso--error" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(campos)}" class="aviso aviso--info">
                Este tipo no tiene campos propios todavía.
            </div>

            <div th:unless="${#lists.isEmpty(campos)}" class="panel panel--tabla">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo de dato</th>
                        <th>Opciones</th>
                        <th>Obligatorio</th>
                        <th>Estado</th>
                        <th class="tabla__acciones">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${campos}">

                        <td th:text="${c.nombre}">-</td>
                        <td th:text="${c.tipoDato.etiqueta}">-</td>
                        <td th:text="${c.opciones} ?: '—'">-</td>
                        <td th:text="${c.obligatorio} ? 'Sí' : 'No'">-</td>

                        <td>
                            <span class="insignia"
                                  th:classappend="${c.activo} ? 'insignia--estable' : 'insignia--neutra'"
                                  th:text="${c.activo} ? 'Activo' : 'Inactivo'">-</span>
                        </td>

                        <td class="tabla__acciones">
                            <a th:href="@{/tipos-equipo/{t}/campos/{c}/editar(t=${tipo.id}, c=${c.id})}"
                               class="boton boton--secundario boton--pequeno">Editar</a>

                            <form th:if="${c.activo}"
                                  th:action="@{/tipos-equipo/{t}/campos/{c}/desactivar(t=${tipo.id}, c=${c.id})}"
                                  method="post" style="display:inline"
                                  data-confirm="¿Inactivar este campo? Dejará de pedirse al registrar equipos.">
                                <button type="submit"
                                        class="boton boton--peligro boton--pequeno">Inactivar</button>
                            </form>

                            <form th:unless="${c.activo}"
                                  th:action="@{/tipos-equipo/{t}/campos/{c}/activar(t=${tipo.id}, c=${c.id})}"
                                  method="post" style="display:inline"
                                  data-confirm="¿Activar este campo?">
                                <button type="submit"
                                        class="boton boton--exito boton--pequeno">Activar</button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

</div>

</body>
</html>
